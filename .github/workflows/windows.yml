name: Build MNN Omni Windows

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows.yml'

jobs:
  build_omni:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MNN with Omni & Audio
        run: |
          mkdir build
          cd build
          cmake .. -DMNN_BUILD_LLM=ON -DMNN_BUILD_LLM_OMNI=ON -DMNN_OPENCL=ON -DMNN_LOW_MEMORY=ON -DMNN_SUPPORT_TRANSFORMER_FUSE=ON
          cmake --build . --config Release -j4

      - name: Package Binaries
        run: |
          mkdir dist
          Copy-Item build\Release\*.exe dist\
          Copy-Item build\Release\*.dll dist\

      - name: Upload Downloadable Zip
        uses: actions/upload-artifact@v4
        with:
          name: mnn-omni-windows
          path: dist/
